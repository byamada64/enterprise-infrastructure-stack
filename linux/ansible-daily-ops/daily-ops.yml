---
- name: Daily Linux Operations Check
  hosts: webservers
  become: yes

  tasks:
    - name: Check uptime
      command: uptime
      register: uptime_result
      changed_when: false

    - name: Check disk usage
      command: df -h
      register: disk_result
      changed_when: false

    - name: Check memory usage
      command: free -h
      register: memory_result
      changed_when: false

    - name: Check failed systemd services
      command: systemctl --failed --no-pager
      register: failed_services
      changed_when: false
      failed_when: false

    - name: Check nginx status
      command: systemctl is-active nginx
      register: nginx_status
      changed_when: false
      failed_when: false

    - name: Show daily ops summary
      debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Uptime: {{ uptime_result.stdout }}"
          - "NGINX Status: {{ nginx_status.stdout }}"
          - "Memory:"
          - "{{ memory_result.stdout_lines }}"
          - "Disk:"
          - "{{ disk_result.stdout_lines }}"
          - "Failed Services:"
          - "{{ failed_services.stdout_lines }}"
