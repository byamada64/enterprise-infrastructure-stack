
global:

  scrape_interval: 15s

scrape_configs:

  - job_name: 'linux_vm'

    static_configs:

      - targets: ['node_exporter:9100']

  - job_name: 'docker_cadvisor'

    static_configs:

      - targets: ['<cadvisor_host>:8080']

    metric_relabel_configs:

      - source_labels: [id]

        regex: '/docker/<container_id>.*'

        target_label: container_name

        replacement: 'tracit_frontend'

